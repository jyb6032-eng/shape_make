<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>알록달록 모양 나라 그림판</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Round&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      font-family: 'Jua', 'Nanum Round', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    /* 배경 격자 패턴 */
    .canvas-bg {
      background-color: #ffffff;
      background-image: radial-gradient(#d5e5ff 1.8px, transparent 1.8px);
      background-size: 24px 24px;
    }
    /* 귀여운 그림자 효과 */
    .chubby-shadow {
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.08);
    }
    .chubby-btn {
      transition: all 0.1s ease;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
    }
    .chubby-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body class="bg-amber-50 h-screen w-screen overflow-hidden flex flex-col justify-between">

  <!-- 1. 상단 헤더: 타이틀 & 작품 저장 / 지우기 액션 -->
  <header class="bg-amber-300 px-4 py-2 flex items-center justify-between border-b-4 border-amber-400 shadow-sm shrink-0">
    <div class="flex items-center gap-2">
      <span class="text-3xl animate-bounce">🎨</span>
      <div>
        <h1 class="text-2xl text-amber-900 tracking-wide leading-none">모양 나라 그림판</h1>
        <p class="text-xs text-amber-800 tracking-normal">초등 1학년 2학기: 세모 ▲ 네모 ■ 동그라미 ●</p>
      </div>
    </div>

    <!-- 통계 배지 (사용한 모양 개수) -->
    <div class="hidden md:flex items-center gap-3 bg-amber-100/90 px-3 py-1.5 rounded-2xl border-2 border-amber-400 text-sm">
      <span class="text-amber-900 font-bold">내가 쓴 모양:</span>
      <span class="text-rose-500 font-bold flex items-center gap-1">▲ 세모 <span id="count-tri">0</span></span>
      <span class="text-blue-500 font-bold flex items-center gap-1">■ 네모 <span id="count-rect">0</span></span>
      <span class="text-emerald-500 font-bold flex items-center gap-1">● 동그라미 <span id="count-circle">0</span></span>
    </div>

    <!-- 조작 버튼 (되돌리기, 선택 삭제, 전체 지우기, 저장) -->
    <div class="flex items-center gap-2">
      <button id="btn-undo" class="chubby-btn bg-amber-400 hover:bg-amber-500 text-amber-950 px-3 py-2 rounded-2xl font-bold text-base flex items-center gap-1 border-2 border-amber-600 disabled:opacity-50 disabled:pointer-events-none" title="되돌리기 (Ctrl+Z)">
        <i class="fa-solid fa-rotate-left"></i>
        <span>되돌리기</span>
      </button>
      <button id="btn-delete-selected" class="chubby-btn bg-orange-400 hover:bg-orange-500 text-white px-3 py-2 rounded-2xl font-bold text-base flex items-center gap-1 border-2 border-orange-600 disabled:opacity-40 disabled:pointer-events-none" title="선택한 모양 지우기">
        <i class="fa-solid fa-xmark text-lg"></i>
        <span>모양 지우기</span>
      </button>
      <button id="btn-clear" class="chubby-btn bg-rose-400 hover:bg-rose-500 text-white px-3 py-2 rounded-2xl font-bold text-base flex items-center gap-1 border-2 border-rose-600">
        <i class="fa-solid fa-trash-can"></i>
        <span>다 지우기</span>
      </button>
      <button id="btn-save" class="chubby-btn bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-2xl font-bold text-base flex items-center gap-1.5 border-2 border-emerald-700">
        <i class="fa-solid fa-download"></i>
        <span>PNG로 다운받기</span>
      </button>
    </div>
  </header>

  <!-- 2. 중앙 메인 작업 영역: 캔버스 + 도구 팔레트 -->
  <main class="flex-1 relative flex overflow-hidden p-2 gap-2">
    
    <!-- 모양 그리기 캔버스 영역 -->
    <div class="flex-1 relative bg-white rounded-3xl border-4 border-amber-300 shadow-inner overflow-hidden">
      <canvas id="mainCanvas" class="canvas-bg w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

      <!-- 빈 캔버스 가이드 힌트 -->
      <div id="empty-guide" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-slate-300 select-none">
        <i class="fa-solid fa-shapes text-7xl mb-3 animate-pulse"></i>
        <p class="text-xl font-bold">오른쪽이나 아래에서 모양을 콕! 눌러보세요</p>
        <p class="text-sm text-slate-400 mt-1">로봇, 자동차, 집, 로켓을 멋지게 만들어 봐요!</p>
      </div>

      <!-- 선택된 모양 조작 툴바 (플로팅 퀵 메뉴) -->
      <div id="shape-controls" class="hidden absolute top-3 left-1/2 -translate-x-1/2 bg-white/95 backdrop-blur-md px-4 py-2 rounded-full border-2 border-amber-400 shadow-xl flex items-center gap-3 z-20">
        <span class="text-amber-800 text-sm font-bold flex items-center gap-1">
          <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i> 선택한 모양:
        </span>
        <button id="ctrl-rotate-left" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-bold" title="왼쪽 회전">↺</button>
        <button id="ctrl-rotate-right" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-bold" title="오른쪽 회전">↻</button>
        <button id="ctrl-size-up" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-lg" title="크게">+</button>
        <button id="ctrl-size-down" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-lg" title="작게">-</button>
        <div class="h-5 w-px bg-slate-200"></div>
        <button id="ctrl-layer-up" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center text-xs" title="맨 위로">⬆</button>
        <button id="ctrl-duplicate" class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center justify-center" title="복사하기">
          <i class="fa-regular fa-copy text-sm"></i>
        </button>
        <button id="ctrl-delete" class="w-8 h-8 rounded-full bg-rose-50 text-rose-600 hover:bg-rose-100 flex items-center justify-center" title="삭제">
          <i class="fa-solid fa-trash text-sm"></i>
        </button>
      </div>
    </div>

    <!-- 우측 모양 추가 팔레트 (태블릿 세로형에서는 하단/우측 배치) -->
    <aside class="w-28 sm:w-36 bg-amber-100 rounded-3xl border-4 border-amber-300 p-2 flex flex-col gap-2 shrink-0 items-center justify-start overflow-y-auto">
      <div class="text-xs font-bold text-amber-800 bg-amber-200/80 px-2.5 py-1 rounded-xl w-full text-center">
        모양 넣기
      </div>

      <!-- 세모 추가 버튼 -->
      <button onclick="addShape('triangle')" class="w-full bg-rose-400 hover:bg-rose-500 text-white rounded-2xl p-2 chubby-btn flex flex-col items-center justify-center border-2 border-rose-600 aspect-square">
        <svg viewBox="0 0 100 100" class="w-12 h-12 fill-white drop-shadow">
          <polygon points="50,15 90,85 10,85" />
        </svg>
        <span class="text-sm font-bold mt-1">세모</span>
      </button>

      <!-- 네모 추가 버튼 -->
      <button onclick="addShape('rectangle')" class="w-full bg-blue-400 hover:bg-blue-500 text-white rounded-2xl p-2 chubby-btn flex flex-col items-center justify-center border-2 border-blue-600 aspect-square">
        <div class="w-10 h-10 bg-white shadow"></div>
        <span class="text-sm font-bold mt-1">네모</span>
      </button>

      <!-- 동그라미 추가 버튼 -->
      <button onclick="addShape('circle')" class="w-full bg-emerald-400 hover:bg-emerald-500 text-white rounded-2xl p-2 chubby-btn flex flex-col items-center justify-center border-2 border-emerald-600 aspect-square">
        <div class="w-11 h-11 bg-white rounded-full shadow"></div>
        <span class="text-sm font-bold mt-1">동그라미</span>
      </button>

      <!-- 예시 샘플 불러오기 버튼 모음 -->
      <div class="w-full border-t-2 border-amber-300 pt-2 mt-1 flex flex-col gap-1.5">
        <span class="text-[11px] font-bold text-amber-700 text-center">만들기 힌트</span>
        <button onclick="loadPreset('rocket')" class="bg-purple-200 hover:bg-purple-300 text-purple-900 text-xs py-1.5 rounded-xl font-bold transition">
          🚀 로켓
        </button>
        <button onclick="loadPreset('house')" class="bg-amber-200 hover:bg-amber-300 text-amber-900 text-xs py-1.5 rounded-xl font-bold transition">
          🏠 예쁜 집
        </button>
        <button onclick="loadPreset('car')" class="bg-sky-200 hover:bg-sky-300 text-sky-900 text-xs py-1.5 rounded-xl font-bold transition">
          🚗 자동차
        </button>
      </div>
    </aside>
  </main>

  <!-- 3. 하단 바: 알록달록 색칠 팔레트 & 두께/선 설정 -->
  <footer class="bg-amber-200 px-4 py-2 border-t-4 border-amber-300 flex items-center justify-between shrink-0 gap-2 overflow-x-auto">
    <div class="flex items-center gap-2">
      <span class="text-sm font-bold text-amber-900 whitespace-nowrap">
        <i class="fa-solid fa-palette text-amber-700"></i> 색깔 고르기:
      </span>
      <!-- 기본 10가지 유치원/초등 친화적 컬러 팔레트 -->
      <div id="palette-colors" class="flex items-center gap-1.5">
        <!-- JS로 생성됨 -->
      </div>
    </div>

    <!-- 스탬프/선 테두리 유무 토글 -->
    <div class="flex items-center gap-2 whitespace-nowrap">
      <label class="flex items-center gap-1.5 bg-white/70 px-3 py-1.5 rounded-xl border border-amber-300 text-xs text-amber-900 cursor-pointer font-bold">
        <input type="checkbox" id="check-outline" checked class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
        검은 테두리
      </label>
    </div>
  </footer>

  <!-- 알림/피드백 모달 토스트 -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-5 py-2.5 rounded-2xl font-bold text-sm shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-3 z-50 flex items-center gap-2">
    <i class="fa-solid fa-bell text-yellow-300"></i>
    <span id="toast-message">알림</span>
  </div>

  <script>
    // --- 1. 전역 상태 및 데이터 구조 ---
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const emptyGuide = document.getElementById('empty-guide');
    const shapeControls = document.getElementById('shape-controls');

    // 색상 목록 (초등 1학년이 좋아하는 밝고 뚜렷한 색상)
    const COLOR_PALETTE = [
      '#EF4444', // 빨강
      '#F97316', // 주황
      '#FACC15', // 노랑
      '#22C55E', // 초록
      '#06B6D4', // 하늘
      '#3B82F6', // 파랑
      '#8B5CF6', // 보라
      '#EC4899', // 핑크
      '#78350F', // 갈색
      '#1E293B'  // 먹색
    ];

    let selectedColor = COLOR_PALETTE[0];
    let shapes = [];
    let historyStack = []; // 실행 취소(되돌리기) 기록 스택
    let selectedShapeIndex = -1;
    let isDragging = false;
    let hasMoved = false; // 드래그 이동 여부 감지
    let isResizing = false;
    let resizeHandleCorner = null; // 'tl', 'tr', 'br', 'bl'
    let initialShapeSize = 0;
    let initialDistToCenter = 0;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // 핸들 반경 및 터치 반경
    const HANDLE_RADIUS = 7;
    const HANDLE_TOUCH_RADIUS = 15;

    // --- 히스토리 저장 (되돌리기용) ---
    function saveHistory() {
      // 깊은 복사로 이전 도형 상태를 스택에 최대 25개까지 보관
      historyStack.push(JSON.stringify(shapes));
      if (historyStack.length > 25) {
        historyStack.shift();
      }
      updateUndoButtonState();
    }

    function undo() {
      if (historyStack.length === 0) {
        showToast('더 이상 되돌릴 작업이 없어요.');
        return;
      }
      const previousState = historyStack.pop();
      shapes = JSON.parse(previousState);
      selectedShapeIndex = -1;
      updateUndoButtonState();
      updateGuideAndCounts();
      render();
      showToast('이전 상태로 되돌렸어요! ↩️');
    }

    function updateUndoButtonState() {
      const undoBtn = document.getElementById('btn-undo');
      if (undoBtn) {
        undoBtn.disabled = historyStack.length === 0;
      }
    }

    // --- 2. 캔버스 해상도 반응형 동기화 ---
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      render();
    }

    window.addEventListener('resize', resizeCanvas);

    // --- 3. 팔레트 UI 초기화 ---
    const paletteContainer = document.getElementById('palette-colors');
    COLOR_PALETTE.forEach((color, idx) => {
      const btn = document.createElement('button');
      btn.className = `w-7 h-7 sm:w-8 sm:h-8 rounded-full border-2 border-white shadow transition transform hover:scale-110 active:scale-95 flex items-center justify-center shrink-0 ${idx === 0 ? 'ring-4 ring-amber-500 scale-110' : ''}`;
      btn.style.backgroundColor = color;
      btn.dataset.color = color;
      btn.onclick = () => {
        // 이전 선택 해제
        document.querySelectorAll('#palette-colors button').forEach(b => b.classList.remove('ring-4', 'ring-amber-500', 'scale-110'));
        btn.classList.add('ring-4', 'ring-amber-500', 'scale-110');
        selectedColor = color;
        
        // 현재 선택된 도형이 있으면 즉시 색상 변경
        if (selectedShapeIndex !== -1 && shapes[selectedShapeIndex]) {
          saveHistory();
          shapes[selectedShapeIndex].color = color;
          render();
        }
      };
      paletteContainer.appendChild(btn);
    });

    // --- 4. 모양 추가 함수 (세모, 네모, 동그라미) ---
    function addShape(type) {
      saveHistory();
      const rect = canvas.getBoundingClientRect();
      const centerX = rect.width / 2 + (Math.random() * 60 - 30);
      const centerY = rect.height / 2 + (Math.random() * 60 - 30);
      const hasOutline = document.getElementById('check-outline').checked;

      const newShape = {
        type: type, // 'triangle', 'rectangle', 'circle'
        x: centerX,
        y: centerY,
        size: 90, // 기준 크기
        color: selectedColor,
        rotation: 0, // 라디안
        outline: hasOutline
      };

      shapes.push(newShape);
      selectedShapeIndex = shapes.length - 1;
      updateGuideAndCounts();
      render();
      showToast('새 모양이 추가되었어요!');
    }

    // 선택된 도형 삭제 함수
    function deleteSelectedShape() {
      if (selectedShapeIndex === -1 || !shapes[selectedShapeIndex]) {
        showToast('지울 모양을 먼저 콕! 눌러주세요.');
        return;
      }
      saveHistory();
      shapes.splice(selectedShapeIndex, 1);
      selectedShapeIndex = -1;
      updateGuideAndCounts();
      render();
      showToast('선택한 모양을 쏙 지웠어요! 🗑️');
    }

    // 테두리 체크박스 토글 감지
    document.getElementById('check-outline').addEventListener('change', (e) => {
      if (selectedShapeIndex !== -1 && shapes[selectedShapeIndex]) {
        saveHistory();
        shapes[selectedShapeIndex].outline = e.target.checked;
        render();
      }
    });

    // --- 5. 히트 테스트 (터치/클릭한 위치의 도형 찾기) ---
    // 선택된 도형의 모서리 핸들 위치 구하기 (월드 좌표계)
    function getHandlePositions(s) {
      const half = s.size / 2;
      const pad = 10;
      const extent = half + pad;
      const corners = {
        tl: { x: -extent, y: -extent },
        tr: { x: extent, y: -extent },
        br: { x: extent, y: extent },
        bl: { x: -extent, y: extent }
      };

      const cos = Math.cos(s.rotation);
      const sin = Math.sin(s.rotation);
      const worldCorners = {};

      for (const [key, pt] of Object.entries(corners)) {
        worldCorners[key] = {
          x: s.x + (pt.x * cos - pt.y * sin),
          y: s.y + (pt.x * sin + pt.y * cos)
        };
      }
      return worldCorners;
    }

    // 모서리 핸들을 클릭했는지 검사
    function getHitHandle(pos) {
      if (selectedShapeIndex === -1 || !shapes[selectedShapeIndex]) return null;
      const s = shapes[selectedShapeIndex];
      const handles = getHandlePositions(s);

      for (const [corner, pt] of Object.entries(handles)) {
        const dx = pos.x - pt.x;
        const dy = pos.y - pt.y;
        if (dx * dx + dy * dy <= HANDLE_TOUCH_RADIUS * HANDLE_TOUCH_RADIUS) {
          return corner;
        }
      }
      return null;
    }

    function getShapeAt(pos) {
      // 위에 그려진 도형(배열 끝)부터 역순으로 탐색
      for (let i = shapes.length - 1; i >= 0; i--) {
        const s = shapes[i];
        const dx = pos.x - s.x;
        const dy = pos.y - s.y;
        
        // 회전 역변환으로 로컬 좌표계 산출
        const cos = Math.cos(-s.rotation);
        const sin = Math.sin(-s.rotation);
        const localX = dx * cos - dy * sin;
        const localY = dx * sin + dy * cos;
        const half = s.size / 2;

        if (s.type === 'rectangle') {
          if (Math.abs(localX) <= half && Math.abs(localY) <= half) {
            return i;
          }
        } else if (s.type === 'circle') {
          const distSq = localX * localX + localY * localY;
          if (distSq <= half * half) {
            return i;
          }
        } else if (s.type === 'triangle') {
          // 정삼각형 내부 판정
          const h = s.size * (Math.sqrt(3) / 2);
          const topY = -h / 2;
          const botY = h / 2;
          if (localY >= topY && localY <= botY) {
            const widthAtY = (localY - topY) / h * s.size;
            if (Math.abs(localX) <= widthAtY / 2) {
              return i;
            }
          }
        }
      }
      return -1;
    }

    // --- 6. 그리기 렌더러 함수 ---
    function render() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);

      shapes.forEach((s, idx) => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rotation);

        const half = s.size / 2;
        ctx.fillStyle = s.color;
        ctx.lineWidth = s.outline ? 3 : 0;
        ctx.strokeStyle = '#1E293B';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        ctx.beginPath();
        if (s.type === 'rectangle') {
          // 1학년 수학 개념에 맞춰 곧은 선과 뾰족한 꼭짓점으로 표현
          ctx.rect(-half, -half, s.size, s.size);
        } else if (s.type === 'circle') {
          ctx.arc(0, 0, half, 0, Math.PI * 2);
        } else if (s.type === 'triangle') {
          const h = s.size * (Math.sqrt(3) / 2);
          ctx.moveTo(0, -h / 2);
          ctx.lineTo(half, h / 2);
          ctx.lineTo(-half, h / 2);
          ctx.closePath();
        }

        ctx.fill();
        if (s.outline) {
          ctx.stroke();
        }

        // 선택 강조 외곽선
        if (idx === selectedShapeIndex) {
          ctx.save();
          ctx.strokeStyle = '#3B82F6';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([6, 6]);
          const pad = 10;
          const extent = half + pad;
          ctx.strokeRect(-extent, -extent, extent * 2, extent * 2);

          // 4개 모서리 조절 핸들 그리기
          ctx.setLineDash([]);
          const corners = [
            [-extent, -extent],
            [extent, -extent],
            [extent, extent],
            [-extent, extent]
          ];

          corners.forEach(([hx, hy]) => {
            ctx.beginPath();
            ctx.arc(hx, hy, HANDLE_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#3B82F6';
            ctx.stroke();
          });

          ctx.restore();
        }

        ctx.restore();
      });

      // 조작 메뉴 및 선택 삭제 버튼 상태 업데이트
      const deleteSelectedBtn = document.getElementById('btn-delete-selected');
      if (selectedShapeIndex !== -1 && shapes[selectedShapeIndex]) {
        shapeControls.classList.remove('hidden');
        if (deleteSelectedBtn) deleteSelectedBtn.disabled = false;
      } else {
        shapeControls.classList.add('hidden');
        if (deleteSelectedBtn) deleteSelectedBtn.disabled = true;
      }
    }

    // 통계 및 안내 문구 업데이트
    function updateGuideAndCounts() {
      if (shapes.length === 0) {
        emptyGuide.classList.remove('hidden');
      } else {
        emptyGuide.classList.add('hidden');
      }

      let tri = 0, rect = 0, circ = 0;
      shapes.forEach(s => {
        if (s.type === 'triangle') tri++;
        else if (s.type === 'rectangle') rect++;
        else if (s.type === 'circle') circ++;
      });
      document.getElementById('count-tri').innerText = tri;
      document.getElementById('count-rect').innerText = rect;
      document.getElementById('count-circle').innerText = circ;
    }

    // --- 7. 마우스 / 터치 이벤트 핸들링 ---
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function onPointerDown(e) {
      const pos = getPointerPos(e);
      hasMoved = false;

      // 1) 먼저 선택된 모양의 모서리 핸들을 눌렀는지 확인
      const hitHandle = getHitHandle(pos);
      if (hitHandle && selectedShapeIndex !== -1) {
        saveHistory(); // 리사이징 시작 전 히스토리 저장
        isResizing = true;
        resizeHandleCorner = hitHandle;
        const s = shapes[selectedShapeIndex];
        initialShapeSize = s.size;
        const dx = pos.x - s.x;
        const dy = pos.y - s.y;
        initialDistToCenter = Math.hypot(dx, dy);
        return;
      }

      // 2) 도형 자체를 눌렀는지 확인
      const hitIdx = getShapeAt(pos);

      if (hitIdx !== -1) {
        selectedShapeIndex = hitIdx;
        isDragging = true;
        dragOffsetX = pos.x - shapes[hitIdx].x;
        dragOffsetY = pos.y - shapes[hitIdx].y;
        
        // 선택된 도형을 맨 위로 가져오기
        const [target] = shapes.splice(hitIdx, 1);
        shapes.push(target);
        selectedShapeIndex = shapes.length - 1;
        
        // 테두리 체크박스 상태 동기화
        document.getElementById('check-outline').checked = target.outline;
      } else {
        selectedShapeIndex = -1;
      }
      render();
    }

    function onPointerMove(e) {
      const pos = getPointerPos(e);

      // 리사이즈 드래그 중인 경우
      if (isResizing && selectedShapeIndex !== -1) {
        hasMoved = true;
        const s = shapes[selectedShapeIndex];
        const currentDist = Math.hypot(pos.x - s.x, pos.y - s.y);
        if (initialDistToCenter > 5) {
          const ratio = currentDist / initialDistToCenter;
          const newSize = Math.round(initialShapeSize * ratio);
          // 최소 30px ~ 최대 380px 사이로 크기 조절
          s.size = Math.min(380, Math.max(30, newSize));
          render();
        }
        return;
      }

      // 위치 이동 드래그 중인 경우
      if (isDragging && selectedShapeIndex !== -1) {
        if (!hasMoved) {
          saveHistory(); // 실제로 드래그 이동이 발생하기 시작할 때 히스토리 저장
        }
        hasMoved = true;
        const s = shapes[selectedShapeIndex];
        s.x = pos.x - dragOffsetX;
        s.y = pos.y - dragOffsetY;
        render();
        return;
      }

      // 마우스 오버 시 커서 모양 변경 (리사이즈 핸들 안내)
      if (!isDragging && !isResizing) {
        const handle = getHitHandle(pos);
        if (handle) {
          canvas.style.cursor = 'nwse-resize';
        } else if (getShapeAt(pos) !== -1) {
          canvas.style.cursor = 'move';
        } else {
          canvas.style.cursor = 'default';
        }
      }
    }

    function onPointerUp() {
      if (isResizing) {
        isResizing = false;
        resizeHandleCorner = null;
      }
      isDragging = false;
    }

    // 이벤트 리스너 등록 (터치 & 마우스 둘 다 완벽 지원)
    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', (e) => {
      onPointerDown(e);
      if (selectedShapeIndex !== -1 || isResizing) e.preventDefault(); // 스크롤 방지
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (isDragging || isResizing) {
        e.preventDefault();
        onPointerMove(e);
      }
    }, { passive: false });

    window.addEventListener('touchend', onPointerUp);

    // --- 8. 선택 도형 세부 조작 (회전, 크기, 복제, 삭제) ---
    document.getElementById('ctrl-rotate-left').addEventListener('click', () => {
      if (selectedShapeIndex === -1) return;
      saveHistory();
      shapes[selectedShapeIndex].rotation -= Math.PI / 12; // 15도
      render();
    });

    document.getElementById('ctrl-rotate-right').addEventListener('click', () => {
      if (selectedShapeIndex === -1) return;
      saveHistory();
      shapes[selectedShapeIndex].rotation += Math.PI / 12; // 15도
      render();
    });

    document.getElementById('ctrl-size-up').addEventListener('click', () => {
      if (selectedShapeIndex === -1) return;
      saveHistory();
      shapes[selectedShapeIndex].size = Math.min(380, shapes[selectedShapeIndex].size + 15);
      render();
    });

    document.getElementById('ctrl-size-down').addEventListener('click', () => {
      if (selectedShapeIndex === -1) return;
      saveHistory();
      shapes[selectedShapeIndex].size = Math.max(30, shapes[selectedShapeIndex].size - 15);
      render();
    });

    document.getElementById('ctrl-layer-up').addEventListener('click', () => {
      if (selectedShapeIndex === -1) return;
      saveHistory();
      const [item] = shapes.splice(selectedShapeIndex, 1);
      shapes.push(item);
      selectedShapeIndex = shapes.length - 1;
      render();
      showToast('도형을 맨 위로 올렸어요!');
    });

    document.getElementById('ctrl-duplicate').addEventListener('click', () => {
      if (selectedShapeIndex === -1) return;
      saveHistory();
      const src = shapes[selectedShapeIndex];
      const copy = { ...src, x: src.x + 20, y: src.y + 20 };
      shapes.push(copy);
      selectedShapeIndex = shapes.length - 1;
      updateGuideAndCounts();
      render();
      showToast('도형을 복사했어요!');
    });

    document.getElementById('ctrl-delete').addEventListener('click', deleteSelectedShape);
    document.getElementById('btn-delete-selected').addEventListener('click', deleteSelectedShape);
    document.getElementById('btn-undo').addEventListener('click', undo);

    // 키보드 단축키 지원 (Backspace, Delete로 삭제 / Ctrl+Z로 되돌리기)
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedShapeIndex !== -1) {
        e.preventDefault();
        deleteSelectedShape();
      } else if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        undo();
      }
    });

    // 전체 지우기
    document.getElementById('btn-clear').addEventListener('click', () => {
      if (shapes.length === 0) return;
      saveHistory();
      shapes = [];
      selectedShapeIndex = -1;
      updateGuideAndCounts();
      render();
      showToast('도화지가 깨끗해졌어요!');
    });

    // --- 9. 패드/기기에 이미지 저장 (PNG 다운로드 기능) ---
    document.getElementById('btn-save').addEventListener('click', async () => {
      if (shapes.length === 0) {
        showToast('저장할 모양이 없어요! 모양을 먼저 꾸며보세요.');
        return;
      }

      // 선택 표시 테두리를 제거하고 캡처
      const prevSelected = selectedShapeIndex;
      selectedShapeIndex = -1;
      render();

      // 고화질 저장을 위해 오프스크린 캔버스에 그리기
      const saveCanvas = document.createElement('canvas');
      saveCanvas.width = canvas.width;
      saveCanvas.height = canvas.height;
      const sCtx = saveCanvas.getContext('2d');

      // 1) 예쁜 배경 채우기 (흰색 도화지)
      sCtx.fillStyle = '#ffffff';
      sCtx.fillRect(0, 0, saveCanvas.width, saveCanvas.height);
      
      // 2) 실제 그린 그림 캔버스 복사
      sCtx.drawImage(canvas, 0, 0);

      // 3) 하단 서명 워터마크 추가
      const dpr = window.devicePixelRatio || 1;
      sCtx.fillStyle = '#78350F';
      sCtx.font = `bold ${16 * dpr}px 'Jua', sans-serif`;
      sCtx.fillText('🏫 1학년 2학기 여러가지 모양 나라 🎨', 20 * dpr, saveCanvas.height - 20 * dpr);

      const date = new Date();
      const fileName = `모양나라_${date.getMonth() + 1}월${date.getDate()}일_${date.getHours()}시${date.getMinutes()}분.png`;

      // 4) Blob 기반의 안전한 PNG 다운로드 처리
      try {
        saveCanvas.toBlob(async (blob) => {
          if (!blob) {
            fallbackDataUrlDownload(saveCanvas, fileName);
            return;
          }

          // 태블릿의 '사진 보관함/기기 공유' 기능이 지원되는 경우 우선 시도
          if (navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: 'image/png' })] })) {
            try {
              const file = new File([blob], fileName, { type: 'image/png' });
              await navigator.share({
                files: [file],
                title: '내가 만든 모양 나라',
                text: '세모, 네모, 동그라미로 꾸민 모양 나라 그림이에요!'
              });
              showToast('🎉 사진/파일로 저장되었습니다!');
              selectedShapeIndex = prevSelected;
              render();
              return;
            } catch (shareErr) {
              // 공유 창 취소 시 일반 다운로드로 폴백
              if (shareErr.name === 'AbortError') {
                selectedShapeIndex = prevSelected;
                render();
                return;
              }
            }
          }

          // 기본 Blob 링크 다운로드
          const blobUrl = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = blobUrl;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          
          setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
          showToast('🎉 PNG 파일로 다운로드되었습니다!');
        }, 'image/png');
      } catch (err) {
        fallbackDataUrlDownload(saveCanvas, fileName);
      }

      // 선택 상태 복원
      selectedShapeIndex = prevSelected;
      render();
    });

    // 구형 브라우저 및 iframe 제약용 폴백 다운로드
    function fallbackDataUrlDownload(targetCanvas, fileName) {
      try {
        const dataUrl = targetCanvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = fileName;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('🎉 PNG 파일로 다운로드되었습니다!');
      } catch (e) {
        showToast('⚠️ 저장을 완료하지 못했습니다. 다시 시도해 주세요.');
      }
    }

    // --- 10. 미리 만들어진 모양 힌트/프리셋 ---
    function loadPreset(type) {
      saveHistory();
      shapes = [];
      const rect = canvas.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;

      if (type === 'rocket') {
        // 로켓: 세모(머리) + 네모(몸통) + 양옆 세모(날개) + 동그라미(창문)
        shapes = [
          { type: 'rectangle', x: cx, y: cy + 10, size: 90, color: '#3B82F6', rotation: 0, outline: true },
          { type: 'triangle', x: cx, y: cy - 70, size: 90, color: '#EF4444', rotation: 0, outline: true },
          { type: 'triangle', x: cx - 55, y: cy + 30, size: 55, color: '#F97316', rotation: -Math.PI / 4, outline: true },
          { type: 'triangle', x: cx + 55, y: cy + 30, size: 55, color: '#F97316', rotation: Math.PI / 4, outline: true },
          { type: 'circle', x: cx, y: cy + 5, size: 40, color: '#FACC15', rotation: 0, outline: true }
        ];
      } else if (type === 'house') {
        // 집: 세모(지붕) + 큰 네모(집 본체) + 작은 네모(문) + 동그라미(창문)
        shapes = [
          { type: 'rectangle', x: cx, y: cy + 30, size: 120, color: '#FBBF24', rotation: 0, outline: true },
          { type: 'triangle', x: cx, y: cy - 70, size: 140, color: '#EF4444', rotation: 0, outline: true },
          { type: 'circle', x: cx, y: cy - 10, size: 36, color: '#06B6D4', rotation: 0, outline: true },
          { type: 'rectangle', x: cx, y: cy + 60, size: 40, color: '#78350F', rotation: 0, outline: true }
        ];
      } else if (type === 'car') {
        // 자동차: 네모(차체) + 작은 네모(지붕) + 동그라미 2개(바퀴)
        shapes = [
          { type: 'rectangle', x: cx, y: cy, size: 130, color: '#22C55E', rotation: 0, outline: true },
          { type: 'rectangle', x: cx - 20, y: cy - 45, size: 70, color: '#06B6D4', rotation: 0, outline: true },
          { type: 'circle', x: cx - 45, y: cy + 65, size: 48, color: '#1E293B', rotation: 0, outline: true },
          { type: 'circle', x: cx + 45, y: cy + 65, size: 48, color: '#1E293B', rotation: 0, outline: true }
        ];
      }

      selectedShapeIndex = -1;
      updateGuideAndCounts();
      render();
      showToast(`${type === 'rocket' ? '로켓' : type === 'house' ? '예쁜 집' : '자동차'}을 불러왔어요!`);
    }

    // 토스트 안내 메시지
    function showToast(text) {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-message');
      msg.textContent = text;
      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3');
      }, 2200);
    }

    // 초기 화면 로드
    window.addEventListener('load', () => {
      resizeCanvas();
      updateGuideAndCounts();
      updateUndoButtonState();
    });
  </script>
</body>
